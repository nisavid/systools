name: mlxctl

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  check:
    name: mlxctl (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11.17", "3.12.15", "3.13.16", "3.14.8", "3.15.0"]
    defaults:
      run:
        working-directory: tools/mlxctl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version-file: tools/mlxctl/pyproject.toml
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Check the locked project
        run: sh scripts/check.sh
      - name: Verify the installed wheel entry points
        run: sh scripts/check-wheel.sh
