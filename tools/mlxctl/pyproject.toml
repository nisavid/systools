[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "mlxctl"
version = "0.1.0"
description = "Manage local MLX runtimes, models, services, and clients"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Ivan D Vasin" }]
dependencies = [
  "httpx>=0.28,<1",
  "huggingface-hub>=1.0,<2",
  "psutil>=7.0",
  "rich>=14,<15",
  "starlette>=0.47,<1",
  "textual>=6,<7",
  "tomlkit>=0.13,<1",
  "typer>=0.16,<1",
  "uvicorn>=0.35,<1",
]

[project.scripts]
mlxctl = "mlxctl.entrypoints:cli_main"
mlxd = "mlxctl.entrypoints:daemon_main"

[tool.hatch.build.targets.wheel]
packages = ["src/mlxctl"]

[dependency-groups]
dev = [
  "hatchling==1.32.4",
  "pyrefly==1.3.2",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.17.0",
  "types-psutil==7.2.2.20260906",
]

[tool.uv]
required-version = "==0.13.0"

[tool.pyrefly]
project-includes = ["src", "tests"]
search-path = ["src"]
python-version = "3.11"
preset = "default"
min-severity = "warn"

[tool.ruff]
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_debug = true
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
filterwarnings = ["error"]
